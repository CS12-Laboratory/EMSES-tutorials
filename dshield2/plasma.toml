#:schema https://raw.githubusercontent.com/CS12-Laboratory/mpiemses3d-schema/refs/heads/main/plasma.schema.json

[meta]
format_version = 2

[meta.unit_conversion]
dx = 0.001
to_c = 1000.0

[meta.physical]
density_m3 = 6.25e11 # 6.25e5 cm^-3
particles_per_cell = 50

[[meta.physical.species]]
label = "electron"
mass_ratio = 1.0
qm_sign = -1
temperature_eV = 3.0
drift_velocity_m_s = 0.0

[[meta.physical.species]]
label = "ion"
mass_ratio = 900.0
qm_sign = 1
temperature_eV = 0.03
drift_velocity_m_s = 0.0

[[meta.physical.conductors]]
group = "group_1"
potential_V = -7.5

[memo]
case = "dshield2"
description = "Lower-density Debye shielding tutorial case."
legacy_input = ".old/plasma.inp"
legacy_preinput = ".old/plasma.preinp"

[esorem]
emflag = 0

[jobcon]
nstep = 20000
jobnum = [0, 1]

[digcon]
hdfdigstart = 0
intfoc = 100
ifdiag = 2000
ijdiag = 2000
daverg = 2
ifxyz = [1, 1, 1, 1, 1, 1, 1]
ijxyz = [1, 1, 1]

[plasma]
cv = 1000.0
wc = -0.0
phiz = 0.0
phixy = 0.0

[tmgrid]
nx = 128
ny = 128
nz = 126
dt = 0.05

[system]
ionchg = 0
nfbnd = [0, 0, 0]
nflag_ecrct = 1
mtd_vbnd = [1, 1, 1]

[[species]]
npin = 103219200
npbnd = [2, 2, 2]
inpf = 1
inpb = 1
injct = 1
