ipahdf = 0
ipadig = 1024
ipaxyz = [0, 0, 0, 0, 0, 0, 0]
qm = -1.0
wp = 0.14876844935175268
path = 2.422984428907874
peth = 2.422984428907874
vdri = 0.0
vdthz = 90.0
vdthxy = 0.0

[[species]]
